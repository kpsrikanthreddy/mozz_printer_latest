name: Mozz Printer Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install setuptools for Python
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify dependency installation
        shell: pwsh
        run: |
          Write-Host "=== Verifying Dependencies (npm ls --depth=0) ==="
          npm ls --depth=0

          Write-Host "=== Verifying Rollup Windows optional binary ==="
          $rollupWinPath = "node_modules/@rollup/rollup-win32-x64-msvc"
          if (-not (Test-Path $rollupWinPath)) {
            Write-Host "❌ FATAL: @rollup/rollup-win32-x64-msvc was not installed by npm ci --include=optional!"
            Write-Host "Contents of node_modules/@rollup:"
            Get-ChildItem "node_modules/@rollup" -ErrorAction SilentlyContinue | Select-Object Name
            throw "Missing required optional dependency: @rollup/rollup-win32-x64-msvc"
          }
          Write-Host "✔ Found @rollup/rollup-win32-x64-msvc at $rollupWinPath"

          Write-Host "=== Verifying esbuild availability ==="
          try {
            $esbuildVer = node -e "const esbuild = require('esbuild'); console.log(esbuild.version);"
            Write-Host "✔ esbuild is available (version: $esbuildVer)"
          } catch {
            Write-Host "❌ FATAL: esbuild is not available!"
            throw "Missing or broken esbuild dependency: $_"
          }

      - name: Rebuild better-sqlite3 for Node runtime
        shell: pwsh
        run: |
          Write-Host "Rebuilding better-sqlite3 for current Node runtime..."
          npm rebuild better-sqlite3 --build-from-source
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rebuild better-sqlite3 for Node runtime."
          }

      - name: Node test diagnostics
        shell: pwsh
        run: |
          Write-Host "=== Node Test Diagnostics ==="
          node --version
          node -p "process.versions.modules"
          node -p "process.versions.electron || 'not-electron'"

      - name: TypeScript checks
        run: npm run lint

      - name: Desktop print-agent tests
        run: npm test

      - name: Production build
        run: npm run build
