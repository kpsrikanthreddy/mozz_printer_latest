name: Build Mozz Printer Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install setuptools for Python
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows Rollup native binding
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('./node_modules/rollup/package.json').version"
          Write-Host "Installed Rollup version: $rollupVersion"
          npm install --no-save --no-package-lock "@rollup/rollup-win32-x64-msvc@$rollupVersion"

      - name: TypeScript checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mozz-printer-windows
          path: release/*.exe
          if-no-files-found: error
