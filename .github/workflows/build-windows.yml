name: Build Mozz Printer Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install setuptools for Python
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows Rollup native binding
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('./node_modules/rollup/package.json').version"
          Write-Host "Installed Rollup version: $rollupVersion"
          npm install --no-save --no-package-lock "@rollup/rollup-win32-x64-msvc@$rollupVersion"

      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        run: |
          $electronVersion = "34.5.8"
          Write-Host "Rebuilding better-sqlite3 explicitly for Electron $electronVersion (x64)..."

          npm exec -- electron-rebuild `
            --force `
            --only better-sqlite3 `
            --version $electronVersion `
            --arch x64

          if ($LASTEXITCODE -ne 0) {
            throw "Electron native dependency rebuild failed with exit code $LASTEXITCODE"
          }

      - name: Verify better-sqlite3 Electron binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem `
            "node_modules/better-sqlite3" `
            -Recurse `
            -Filter "better_sqlite3.node" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $binary) {
            Get-ChildItem "node_modules/better-sqlite3" -Recurse |
              Select-Object FullName
            throw "better_sqlite3.node was not generated"
          }

          Write-Host "Native binary generated: $($binary.FullName)"

      - name: Electron-runtime SQLite smoke test
        shell: pwsh
        run: |
          node scripts/run-electron-sqlite-smoke-test.cjs
          if ($LASTEXITCODE -ne 0) {
            throw "Electron-runtime SQLite smoke test FAILED with exit code $LASTEXITCODE"
          }

      - name: TypeScript checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged native dependency
        shell: pwsh
        run: |
          $packaged = Get-ChildItem `
            -Path "release" `
            -Filter "better_sqlite3.node" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $packaged) {
            throw "Packaged Electron application does not contain better_sqlite3.node under release"
          }

          $packaged | ForEach-Object {
            Write-Host "Found packaged native binary: $($_.FullName)"
          }

      - name: Packaged app smoke test (ready-to-show)
        shell: pwsh
        run: |
          $unpackedExe = Get-Item "release\win-unpacked\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unpackedExe -and (Test-Path $unpackedExe.FullName)) {
            Write-Host "Launching unpacked app for smoke test: $($unpackedExe.FullName) --smoke-test"
            
            $startTime = Get-Date
            $proc = Start-Process -FilePath $unpackedExe.FullName -ArgumentList "--smoke-test" -PassThru -NoNewWindow
            $timeoutMs = 45000
            $finished = $proc.WaitForExit($timeoutMs)
            $elapsed = ((Get-Date) - $startTime).TotalSeconds
            Write-Host "Unpacked app execution time: $elapsed seconds"
            
            $logFile = Get-ChildItem -Path "$env:APPDATA" -Filter "main.log" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            
            if (-not $finished) {
              Write-Host "Process did not exit within $($timeoutMs / 1000)s. Forcing process shutdown..."
              Stop-Process -Id $proc.Id -Force
              
              if ($logFile) {
                Write-Host "=== Diagnostic Log: $($logFile.FullName) ==="
                Get-Content $logFile.FullName
              }
              throw "Packaged app smoke test FAILED: Timed out waiting for ready-to-show."
            }
            
            Write-Host "Packaged app exited with code: $($proc.ExitCode)"
            
            if ($logFile) {
              Write-Host "=== Diagnostic Log ($($logFile.FullName)) ==="
              Get-Content $logFile.FullName
              $logContent = Get-Content $logFile.FullName -Raw
              if (-not ($logContent -match "ready-to-show confirmed")) {
                throw "Packaged app smoke test FAILED: Application exited immediately before reaching ready-to-show!"
              }
            } else {
              throw "Packaged app smoke test FAILED: Diagnostic log main.log was not found."
            }
            
            if ($proc.ExitCode -ne 0) {
              throw "Packaged app smoke test FAILED with exit code $($proc.ExitCode)"
            }
            Write-Host "Packaged app smoke test SUCCEEDED: Main window reached ready-to-show!"
          } else {
            Write-Host "No unpacked binary in release\win-unpacked, skipping unpacked check."
          }

      - name: Generate size report
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "📊 MOZZ PRINT AGENT WINDOWS PACKAGING & SIZE REPORT"
          Write-Host "============================================================"
          
          # 1. NSIS Installer Size
          $installer = Get-ChildItem -Path "release" -Filter "*Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            $instMB = [math]::Round($installer.Length / 1MB, 2)
            $instKB = [math]::Round($installer.Length / 1KB, 2)
            Write-Host "NSIS Installer: $($installer.Name)"
            Write-Host "  Path: $($installer.FullName)"
            Write-Host "  Size: $instMB MB ($instKB KB / $($installer.Length) bytes)"
          } else {
            throw "NSIS installer (*Setup*.exe) not found in release directory!"
          }

          # 2. Unpacked Application Size
          $unpackedDir = "release\win-unpacked"
          if (Test-Path $unpackedDir) {
            $unpackedFiles = Get-ChildItem -Path $unpackedDir -Recurse -File
            $unpackedBytes = ($unpackedFiles | Measure-Object -Property Length -Sum).Sum
            $unpackedMB = [math]::Round($unpackedBytes / 1MB, 2)
            Write-Host "`nUnpacked Application Directory ($unpackedDir):"
            Write-Host "  Total Files: $($unpackedFiles.Count)"
            Write-Host "  Total Size: $unpackedMB MB ($unpackedBytes bytes)"
          } else {
            Write-Warning "Unpacked directory $unpackedDir does not exist."
          }

          # 3. app.asar Size
          $asar = Get-ChildItem -Path "release" -Filter "app.asar" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($asar) {
            $asarMB = [math]::Round($asar.Length / 1MB, 2)
            $asarKB = [math]::Round($asar.Length / 1KB, 2)
            Write-Host "`napp.asar Archive:"
            Write-Host "  Path: $($asar.FullName)"
            Write-Host "  Size: $asarMB MB ($asarKB KB / $($asar.Length) bytes)"
          } else {
            Write-Warning "app.asar file not found."
          }

          # 4. Unpacked better-sqlite3 Size
          $sqliteDir = Get-ChildItem -Path "release" -Filter "better-sqlite3" -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sqliteDir) {
            $sqliteFiles = Get-ChildItem -Path $sqliteDir.FullName -Recurse -File
            $sqliteBytes = ($sqliteFiles | Measure-Object -Property Length -Sum).Sum
            $sqliteMB = [math]::Round($sqliteBytes / 1MB, 2)
            $sqliteKB = [math]::Round($sqliteBytes / 1KB, 2)
            Write-Host "`nUnpacked better-sqlite3 Module:"
            Write-Host "  Path: $($sqliteDir.FullName)"
            Write-Host "  Size: $sqliteMB MB ($sqliteKB KB / $sqliteBytes bytes)"
          } else {
            Write-Warning "Unpacked better-sqlite3 directory not found."
          }
          Write-Host "============================================================"

      - name: Verify, install and smoke test NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer -or -not (Test-Path $installer.FullName)) {
            throw "NSIS Setup installer (*Setup*.exe) was not found in release/ directory"
          }
          Write-Host "Found NSIS Setup installer: $($installer.FullName)"
          
          # Clean up any existing logs from previous smoke tests
          Remove-Item -Path "$env:APPDATA\mozz-printer\logs\*" -Force -ErrorAction SilentlyContinue
          
          # Perform silent installation
          Write-Host "Running silent installation: $($installer.FullName) /S"
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "Installer finished with exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent NSIS installation failed with exit code $($installProcess.ExitCode)"
          }
          
          # Allow Windows shell time to register shortcuts
          Start-Sleep -Seconds 2

          # Locate installed shortcut or installed binary
          $candidateShortcuts = @(
            "$env:USERPROFILE\Desktop\Mozz Print Agent.lnk",
            "$([Environment]::GetFolderPath('Desktop'))\Mozz Print Agent.lnk",
            "$([Environment]::GetFolderPath('CommonDesktopDirectory'))\Mozz Print Agent.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Mozz Print Agent.lnk",
            "$([Environment]::GetFolderPath('Programs'))\Mozz Print Agent.lnk"
          )

          $foundShortcut = $null
          foreach ($sc in $candidateShortcuts) {
            if (Test-Path $sc) {
              $foundShortcut = $sc
              Write-Host "Confirmed shortcut exists at: $sc"
              break
            }
          }

          $installedExePath = $null
          if ($foundShortcut) {
            $wsh = New-Object -ComObject WScript.Shell
            $shortcutObj = $wsh.CreateShortcut($foundShortcut)
            $installedExePath = $shortcutObj.TargetPath
            Write-Host "Resolved shortcut target executable: $installedExePath"
          }

          # Fallback check standard install directories if shortcut is delayed
          if (-not $installedExePath -or -not (Test-Path $installedExePath)) {
            Write-Host "Searching standard per-user program installation directories..."
            $foundExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "*Mozz*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $foundExe) {
              $foundExe = Get-ChildItem -Path "$env:ProgramFiles" -Filter "*Mozz*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($foundExe) {
              $installedExePath = $foundExe.FullName
            }
          }

          if (-not $installedExePath -or -not (Test-Path $installedExePath)) {
            throw "Installed application executable target could not be verified on disk."
          }
          Write-Host "Verified installed application executable exists at: $installedExePath"

          # Launch the installed executable to confirm window reaches ready-to-show
          Write-Host "Launching installed executable with --smoke-test: $installedExePath"
          $startTime = Get-Date
          $appProc = Start-Process -FilePath $installedExePath -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          $timeoutMs = 45000
          $finished = $appProc.WaitForExit($timeoutMs)
          $elapsed = ((Get-Date) - $startTime).TotalSeconds
          Write-Host "Installed app smoke test process duration: $elapsed seconds"

          $logFile = Get-ChildItem -Path "$env:APPDATA" -Filter "main.log" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $finished) {
            Write-Host "Process did not exit within $($timeoutMs / 1000)s. Forcing process shutdown..."
            Stop-Process -Id $appProc.Id -Force
            if ($logFile) {
              Write-Host "=== Diagnostic Log ($($logFile.FullName)) ==="
              Get-Content $logFile.FullName
            }
            throw "Installed app smoke test FAILED: Timed out waiting for ready-to-show."
          }

          Write-Host "Installed app exited with code: $($appProc.ExitCode)"
          if ($logFile) {
            Write-Host "=== Diagnostic Log ($($logFile.FullName)) ==="
            Get-Content $logFile.FullName
            $logContent = Get-Content $logFile.FullName -Raw
            if (-not ($logContent -match "ready-to-show confirmed")) {
              throw "Installed app smoke test FAILED: Application exited before ready-to-show was confirmed!"
            }
          } else {
            throw "Installed app smoke test FAILED: Diagnostic log main.log was not created."
          }

          if ($appProc.ExitCode -ne 0) {
            throw "Installed app smoke test FAILED with exit code $($appProc.ExitCode)"
          }
          Write-Host "Installed app smoke test SUCCEEDED: Main window reached ready-to-show!"

      - name: Collect diagnostic logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "diagnostic-logs" | Out-Null
          $appDataLogs = Get-ChildItem -Path "$env:APPDATA\mozz-printer" -Filter "*.log" -Recurse -ErrorAction SilentlyContinue
          if ($appDataLogs) {
            $appDataLogs | ForEach-Object {
              Copy-Item $_.FullName -Destination "diagnostic-logs/$($_.Name)" -Force
              Write-Host "Collected diagnostic log: $($_.FullName)"
            }
          }
          $localLogs = Get-ChildItem -Path "logs" -Filter "*.log" -Recurse -ErrorAction SilentlyContinue
          if ($localLogs) {
            $localLogs | ForEach-Object {
              Copy-Item $_.FullName -Destination "diagnostic-logs/local-$($_.Name)" -Force
              Write-Host "Collected local log: $($_.FullName)"
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: mozz-printer-windows-setup
          path: release/*Setup*.exe
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mozz-printer-diagnostic-logs
          path: diagnostic-logs/*.log
          if-no-files-found: ignore
