name: Build Mozz Printer Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install setuptools for Python
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows Rollup native binding
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('./node_modules/rollup/package.json').version"
          Write-Host "Installed Rollup version: $rollupVersion"
          npm install --no-save --no-package-lock "@rollup/rollup-win32-x64-msvc@$rollupVersion"

      - name: TypeScript checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Rebuild better-sqlite3 for installed Electron ABI
        shell: pwsh
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "Rebuilding better-sqlite3 for Electron $electronVersion x64"

          $env:npm_config_runtime = "electron"
          $env:npm_config_target = $electronVersion
          $env:npm_config_target_arch = "x64"
          $env:npm_config_arch = "x64"
          $env:npm_config_disturl = "https://electronjs.org/headers"
          $env:npm_config_build_from_source = "true"

          npm rebuild better-sqlite3

      - name: Verify better-sqlite3 native binary
        shell: pwsh
        run: |
          $binaries = Get-ChildItem `
            -Path "node_modules/better-sqlite3" `
            -Filter "better_sqlite3.node" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $binaries) {
            Write-Host "Contents of better-sqlite3:"
            Get-ChildItem "node_modules/better-sqlite3" -Recurse |
              Select-Object FullName
            throw "better_sqlite3.node was not generated"
          }

          $binaries | ForEach-Object {
            Write-Host "Found native binary: $($_.FullName)"
          }

      - name: Build unpacked application
        run: npm run build:electron && npx electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged native dependency
        shell: pwsh
        run: |
          $packaged = Get-ChildItem `
            -Path "release" `
            -Filter "better_sqlite3.node" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $packaged) {
            throw "Packaged Electron application does not contain better_sqlite3.node"
          }

          $packaged | ForEach-Object {
            Write-Host "Packaged binary: $($_.FullName)"
          }

      - name: Packaged app smoke test (ready-to-show)
        shell: pwsh
        run: |
          $unpackedExe = Get-Item "release\win-unpacked\*.exe" | Select-Object -First 1
          if (-not $unpackedExe -or -not (Test-Path $unpackedExe.FullName)) {
            throw "Packaged executable not found in release\win-unpacked\"
          }
          Write-Host "Launching packaged app for smoke test: $($unpackedExe.FullName) --smoke-test"
          
          $startTime = Get-Date
          # Launch packaged Electron app with smoke test flag
          $proc = Start-Process -FilePath $unpackedExe.FullName -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          $timeoutMs = 45000
          $finished = $proc.WaitForExit($timeoutMs)
          $elapsed = ((Get-Date) - $startTime).TotalSeconds
          Write-Host "Process execution time: $elapsed seconds"
          
          $logFile = Get-ChildItem -Path "$env:APPDATA" -Filter "main.log" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $finished) {
            Write-Host "Process did not exit within $($timeoutMs / 1000)s. Forcing process shutdown..."
            Stop-Process -Id $proc.Id -Force
            
            if ($logFile) {
              Write-Host "=== Diagnostic Log: $($logFile.FullName) ==="
              Get-Content $logFile.FullName
            }
            throw "Packaged app smoke test FAILED: Timed out waiting for ready-to-show."
          }
          
          Write-Host "Packaged app exited with code: $($proc.ExitCode)"
          
          if ($logFile) {
            Write-Host "=== Diagnostic Log ($($logFile.FullName)) ==="
            Get-Content $logFile.FullName
            $logContent = Get-Content $logFile.FullName -Raw
            if (-not ($logContent -match "ready-to-show confirmed")) {
              throw "Packaged app smoke test FAILED: Application exited immediately before reaching ready-to-show!"
            }
          } else {
            throw "Packaged app smoke test FAILED: Diagnostic log main.log was not found."
          }
          
          if ($proc.ExitCode -ne 0) {
            throw "Packaged app smoke test FAILED with exit code $($proc.ExitCode)"
          }
          Write-Host "Packaged app smoke test SUCCEEDED: Main window reached ready-to-show!"

      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mozz-printer-windows
          path: release/*.exe
          if-no-files-found: error
